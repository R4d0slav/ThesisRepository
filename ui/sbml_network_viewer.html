<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBML Network Visualizer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>
<style>
  :root {
    --bg: #0a0e17;
    --panel: #111827;
    --panel2: #1a2236;
    --border: #1e3050;
    --text: #c8d6ef;
    --text-dim: #5a7090;
    --accent: #38bdf8;
    --accent2: #818cf8;
    --green: #34d399;
    --yellow: #fbbf24;
    --red: #f87171;
    --pink: #f472b6;
    --orange: #fb923c;
    --teal: #2dd4bf;
    --font-mono: 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  
  /* HEADER */
  #header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }
  #header h1 {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
  #header .stats {
    display: flex;
    gap: 12px;
    font-size: 11px;
    color: var(--text-dim);
  }
  #header .stats span b { color: var(--text); }
  #search-wrap {
    flex: 1;
    position: relative;
    max-width: 280px;
  }
  #search {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px 6px 30px;
    color: var(--text);
    font-size: 12px;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #search-wrap svg {
    position: absolute;
    left: 8px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px;
    color: var(--text-dim);
    pointer-events: none;
  }
  #search-results {
    position: absolute;
    top: 100%; left: 0; right: 0;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-top: 4px;
    max-height: 200px;
    overflow-y: auto;
    z-index: 100;
    display: none;
  }
  #search-results.open { display: block; }
  .sr-item {
    padding: 6px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }
  .sr-item:hover { background: var(--panel); }
  .sr-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* LAYOUT */
  #main { display: flex; flex: 1; overflow: hidden; }
  
  /* SIDEBAR LEFT */
  #sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-section {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-section h3 {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  
  /* Filter pills */
  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .filter-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .filter-row:hover { background: var(--panel2); }
  .filter-row input { cursor: pointer; accent-color: var(--accent); }
  .filter-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .filter-label { flex: 1; font-size: 11px; }
  .filter-count { font-size: 10px; color: var(--text-dim); font-family: var(--font-mono); }
  
  /* Layout buttons */
  .btn-group { display: flex; flex-wrap: wrap; gap: 4px; }
  .btn {
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--panel2);
    color: var(--text);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.active { border-color: var(--accent); background: rgba(56,189,248,0.12); color: var(--accent); }
  
  /* Canvas area */
  #cy-wrap { flex: 1; position: relative; overflow: hidden; }
  #cy { width: 100%; height: 100%; }
  
  /* Loading overlay */
  #loading {
    position: absolute; inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 50;
    gap: 12px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: var(--text-dim); font-size: 12px; }
  
  /* Right panel - inspector */
  #inspector {
    width: 260px;
    flex-shrink: 0;
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 0.2s;
  }
  #inspector.collapsed { width: 0; }
  #inspector-inner {
    padding: 12px;
    overflow-y: auto;
    flex: 1;
  }
  .inspector-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .insp-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
    word-break: break-word;
    line-height: 1.4;
  }
  .insp-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    margin-bottom: 10px;
    border: 1px solid;
  }
  .insp-rows { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .insp-row { display: flex; gap: 6px; }
  .insp-key {
    width: 80px;
    flex-shrink: 0;
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding-top: 1px;
  }
  .insp-val { font-size: 12px; color: var(--text); word-break: break-word; }
  .insp-section { margin-top: 10px; }
  .insp-section h4 {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .neighbor-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-height: 180px;
    overflow-y: auto;
  }
  .neighbor-item {
    padding: 4px 6px;
    border-radius: 4px;
    font-size: 11px;
    background: var(--panel2);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .neighbor-item:hover { border: 1px solid var(--accent); margin: -1px; }
  .empty-state {
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    padding: 40px 20px;
  }
  
  /* Toolbar */
  #toolbar {
    position: absolute;
    top: 12px; right: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 5;
  }
  .tool-btn {
    width: 32px; height: 32px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.15s;
  }
  .tool-btn:hover { border-color: var(--accent); color: var(--accent); }
  
  /* Legend */
  #legend {
    position: absolute;
    bottom: 12px; left: 12px;
    background: rgba(17,24,39,0.9);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 10px;
    color: var(--text-dim);
    z-index: 5;
    backdrop-filter: blur(4px);
  }
  #legend .leg-title { font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.1em; }
  .leg-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .leg-dot { width: 10px; height: 10px; border-radius: 2px; }

  /* Flow animation */
  @keyframes flowPulse {
    0%   { line-color: #38bdf8; opacity: 0.2; width: 1; }
    50%  { line-color: #38bdf8; opacity: 1;   width: 3; }
    100% { line-color: #38bdf8; opacity: 0.2; width: 1; }
  }
  .flow-edge {
    animation: flowPulse 1.2s ease-in-out infinite;
  }
  .flow-node {
    border-width: 3px !important;
    border-color: #38bdf8 !important;
  }
  #flow-controls {
    position: absolute;
    bottom: 12px; right: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 5;
    background: rgba(17,24,39,0.92);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    min-width: 180px;
    backdrop-filter: blur(4px);
    font-size: 11px;
  }
  #flow-controls .fc-title {
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 2px;
  }
  #flow-controls .fc-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #flow-btn {
    width: 100%;
    padding: 6px;
    border: 1px solid var(--accent);
    border-radius: 5px;
    background: rgba(56,189,248,0.12);
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }
  #flow-btn:hover { background: rgba(56,189,248,0.25); }
  #flow-btn.active {
    background: rgba(56,189,248,0.3);
    box-shadow: 0 0 8px rgba(56,189,248,0.4);
  }
  #flow-speed {
    width: 100%;
    accent-color: var(--accent);
    margin-top: 2px;
  }
  .fc-label { color: var(--text-dim); }
  .fc-value { color: var(--text); font-family: var(--font-mono); }

  /* Dagre smart layout buttons */
  .btn[data-layout="dagre-tb"]  { }
  .btn[data-layout="dagre-lr"]  { }

</style>
</head>
<body>

<div id="header">
  <h1>⬡ SBML Network</h1>
  <div class="stats">
    <span><b>1139</b> species</span>
    <span><b>864</b> reactions</span>
    <span><b>1605</b> edges</span>
  </div>
  <div id="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="search" placeholder="Search species..." autocomplete="off">
    <div id="search-results"></div>
  </div>
</div>

<div id="main">
  <!-- LEFT SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-section">
      <h3>Node Type</h3>
      <div class="filter-group" id="type-filters"></div>
    </div>
    <div class="sidebar-section">
      <h3>Compartment</h3>
      <div class="filter-group" id="comp-filters"></div>
    </div>
    <div class="sidebar-section">
      <h3>Layout</h3>
      <div class="btn-group">
        <button class="btn" data-layout="cose" onclick="runLayout('cose')">CoSE</button>
        <button class="btn" data-layout="circle" onclick="runLayout('circle')">Circle</button>
        <button class="btn" data-layout="grid" onclick="runLayout('grid')">Grid</button>
        <button class="btn" data-layout="concentric" onclick="runLayout('concentric')">Concentric</button>
        <button class="btn" data-layout="breadthfirst" onclick="runLayout('breadthfirst')">Hierarchy</button>
        <button class="btn" data-layout="dagre-tb" onclick="runLayout('dagre-tb')">DAG ↓</button>
        <button class="btn active" data-layout="dagre-lr" onclick="runLayout('dagre-lr')">DAG →</button>
        <button class="btn" data-layout="random" onclick="runLayout('random')">Random</button>
      </div>
    </div>
    <div class="sidebar-section" style="flex:1;overflow-y:auto;">
      <h3>Degree Filter</h3>
      <div style="padding: 4px 0;">
        <label style="font-size:11px;color:var(--text-dim);">Min connections: <b id="deg-val">1</b></label>
        <input type="range" id="deg-filter" min="1" max="30" value="1" style="width:100%;margin-top:6px;accent-color:var(--accent);">
      </div>
      <div style="margin-top:12px;">
        <h3 style="font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;">Options</h3>
        <label class="filter-row">
          <input type="checkbox" id="show-labels" checked onchange="toggleLabels()">
          <span class="filter-label">Show labels</span>
        </label>
        <label class="filter-row">
          <input type="checkbox" id="show-modifiers" checked onchange="applyFilters()">
          <span class="filter-label">Show modifier edges</span>
        </label>
      </div>
    </div>
  </div>

  <!-- CANVAS -->
  <div id="cy-wrap">
    <div id="loading">
      <div class="spinner"></div>
      <p>Building network graph…</p>
    </div>
    <div id="cy"></div>

    <div id="flow-controls">
      <div class="fc-title">▶ Flow Animation</div>
      <button id="flow-btn" onclick="toggleFlow()">▶ Start Flow</button>
      <div class="fc-row">
        <span class="fc-label">Speed</span>
        <input type="range" id="flow-speed" min="200" max="1800" value="650" step="50" oninput="updateFlowSpeed(this.value)">
        <span class="fc-value" id="flow-speed-val">0.7s</span>
      </div>
      <div class="fc-row" style="margin-top:4px;">
        <span class="fc-label" style="font-size:10px;">Hubs only</span>
        <input type="checkbox" id="flow-hubs-only" onchange="applyFlow()" style="accent-color:var(--accent)">
      </div>
    </div>

    <div id="toolbar">
      <button class="tool-btn" title="Zoom in" onclick="cy.zoom(cy.zoom()*1.3)">＋</button>
      <button class="tool-btn" title="Zoom out" onclick="cy.zoom(cy.zoom()*0.77)">－</button>
      <button class="tool-btn" title="Fit all" onclick="cy.fit(undefined,40)">⊡</button>
      <button class="tool-btn" title="Toggle inspector" onclick="toggleInspector()">⊞</button>
    </div>
    <div id="legend">
      <div class="leg-title">Node Types</div>
      <div class="leg-row"><div class="leg-dot" style="background:#38bdf8"></div>protein</div>
      <div class="leg-row"><div class="leg-dot" style="background:#818cf8"></div>complex</div>
      <div class="leg-row"><div class="leg-dot" style="background:#34d399"></div>gene</div>
      <div class="leg-row"><div class="leg-dot" style="background:#fbbf24"></div>small molecule</div>
      <div class="leg-row"><div class="leg-dot" style="background:#f472b6"></div>perturbation</div>
      <div class="leg-row"><div class="leg-dot" style="background:#fb923c"></div>enzyme</div>
      <div class="leg-row"><div class="leg-dot" style="background:#2dd4bf"></div>RNA / other</div>
    </div>
  </div>

  <!-- RIGHT INSPECTOR -->
  <div id="inspector">
    <div id="inspector-inner">
      <div class="inspector-title">Inspector</div>
      <div class="empty-state" id="insp-empty">
        Click a node or edge<br>to inspect it
      </div>
      <div id="insp-content" style="display:none;"></div>
    </div>
  </div>
</div>

const TYPE_COLORS = {
  protein:       '#38bdf8',
  complex:       '#818cf8',
  gene:          '#34d399',
  small_molecule:'#fbbf24',
  perturbation:  '#f472b6',
  enzyme:        '#fb923c',
  RNA:           '#2dd4bf',
  inhibitor:     '#ef4444',
  phenotype:     '#a78bfa',
  other:         '#64748b',
};

const COMP_COLORS = {
  c_cyt: '#3b82f6',
  c_nuc: '#a855f7',
  c_per: '#22c55e',
  c_er:  '#f97316',
  c_x:   '#94a3b8',
  c_chl: '#4ade80',
  c_vac: '#2dd4bf',
  c_mit: '#fb923c',
  c_ap:  '#e879f9',
  c_ga:  '#fbbf24',
};

const COMPARTMENTS = {
  c_cyt:'cytoplasm', c_nuc:'nucleus', c_per:'peroxisome',
  c_er:'endoplasmic reticulum', c_x:'extracellular', c_chl:'chloroplast',
  c_vac:'vacuole', c_mit:'mitochondrion', c_ap:'apoplast', c_ga:'golgi apparatus'
};

// ============================================================
// STATE
// ============================================================
let cy;
let activeTypes = new Set(Object.keys(TYPE_COLORS));
let activeComps = new Set(Object.keys(COMPARTMENTS));
let minDegree = 1;
let showLabels = true;
let showModifiers = true;
let lastLayoutName = 'dagre-lr';


// ============================================================
// INIT CYTOSCAPE
// ============================================================
function initCy() {
  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: ELEMENTS,
    style: getCyStyle(),
    layout: { name: 'preset' },
    minZoom: 0.05,
    maxZoom: 8,
    wheelSensitivity: 0.2,
    hideEdgesOnViewport: true,
    textureOnViewport: true,
    motionBlur: false,
    pixelRatio: 1,
  });

  cy.on('tap', 'node', e => inspectNode(e.target));
  cy.on('tap', 'edge', e => inspectEdge(e.target));
  cy.on('tap', e => { if (e.target === cy) clearInspect(); });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && flowActive) stopFlow();
  });
  window.addEventListener('resize', debounce(() => cy.resize(), 120));

  document.getElementById('loading').style.display = 'none';
  buildFilters();
  applyFilters({ skipFlowReset: true });
  requestAnimationFrame(() => runLayout('dagre-lr'));
}

function debounce(fn, delay = 150) {
  let timer = null;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}

function getCyStyle() {
  return [
    {
      selector: 'node',
      style: {
        'width': ele => Math.max(16, Math.min(48, 14 + ele.data('degree') * 1.5)),
        'height': ele => Math.max(16, Math.min(48, 14 + ele.data('degree') * 1.5)),
        'background-color': ele => TYPE_COLORS[ele.data('type')] || '#64748b',
        'border-color': ele => TYPE_COLORS[ele.data('type')] || '#64748b',
        'border-width': 1,
        'border-opacity': 0.7,
        'label': showLabels ? 'data(label)' : '',
        'font-size': 9,
        'font-family': 'Segoe UI, system-ui, sans-serif',
        'color': '#c8d6ef',
        'text-valign': 'bottom',
        'text-halign': 'center',
        'text-margin-y': 3,
        'text-outline-color': '#0a0e17',
        'text-outline-width': 2,
        'opacity': 1,
        'shape': ele => {
          const t = ele.data('type');
          if (t === 'gene') return 'rectangle';
          if (t === 'small_molecule') return 'ellipse';
          if (t === 'complex') return 'diamond';
          if (t === 'perturbation') return 'triangle';
          return 'ellipse';
        },
      }
    },
    {
      selector: 'node:selected',
      style: {
        'border-color': '#ffffff',
        'border-width': 3,
        'background-opacity': 1,
      }
    },
    {
      selector: 'edge',
      style: {
        'width': 1,
        'line-color': '#1e3050',
        'target-arrow-color': '#2a4060',
        'target-arrow-shape': 'triangle',
        'curve-style': 'bezier',
        'opacity': 0.6,
        'arrow-scale': 0.8,
      }
    },
    {
      selector: 'edge[edgeType="modifier"]',
      style: {
        'line-color': '#2a4060',
        'target-arrow-shape': 'circle',
        'line-style': 'dashed',
        'line-dash-pattern': [4, 3],
        'opacity': 0.4,
      }
    },
    {
      selector: 'edge:selected',
      style: {
        'width': 2,
        'line-color': '#38bdf8',
        'target-arrow-color': '#38bdf8',
        'opacity': 1,
      }
    },
    {
      selector: '.highlighted',
      style: { 'opacity': 1, 'line-color': '#38bdf8', 'target-arrow-color': '#38bdf8', 'width': 2 }
    },
    {
      selector: '.faded',
      style: { 'opacity': 0.08 }
    },
    {
      selector: '.hidden',
      style: { 'display': 'none' }
    },
  ];
}

// ============================================================
// LAYOUT
// ============================================================
function runLayout(name) {
  if (!cy) return;
  lastLayoutName = name;
  document.querySelectorAll('[data-layout]').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-layout="${name}"]`)?.classList.add('active');
  
  const visibleNodeCount = cy.nodes(':visible').length;
  const animateLayout = visibleNodeCount <= 250;
  const base = { animate: animateLayout, fit: true, padding: 40, nodeDimensionsIncludeLabels: false };

  const configs = {
    cose: {
      ...base,
      name: 'cose',
      randomize: false,
      nodeRepulsion: 200000,
      nodeOverlap: 6,
      idealEdgeLength: 40,
      edgeElasticity: 60,
      gravity: 1,
      numIter: visibleNodeCount > 500 ? 350 : 600,
      coolingFactor: 0.95,
    },
    circle: { ...base, name: 'circle' },
    grid: { ...base, name: 'grid', condense: true },
    concentric: { ...base, name: 'concentric', concentric: n => n.data('degree'), levelWidth: () => 2 },
    breadthfirst: { ...base, name: 'breadthfirst', directed: true, spacingFactor: 1.05 },
    random: { ...base, name: 'random' },
    'dagre-tb': {
      ...base,
      name: 'dagre',
      rankDir: 'TB',
      ranker: 'network-simplex',
      nodeSep: 18,
      rankSep: 40,
      edgeSep: 6,
    },
    'dagre-lr': {
      ...base,
      name: 'dagre',
      rankDir: 'LR',
      ranker: 'network-simplex',
      nodeSep: 16,
      rankSep: 50,
      edgeSep: 6,
    },
  };
  
  cy.stop();
  cy.layout(configs[name] || configs.random).run();
}

// ============================================================
// FILTERS
// ============================================================
function buildFilters() {
  // Type filters
  const typeCounts = {};
  cy.nodes().forEach(n => {
    const t = n.data('type');
    typeCounts[t] = (typeCounts[t] || 0) + 1;
  });
  
  const typeContainer = document.getElementById('type-filters');
  Object.entries(TYPE_COLORS).forEach(([type, color]) => {
    if (!typeCounts[type]) return;
    const row = document.createElement('label');
    row.className = 'filter-row';
    row.innerHTML = `
      <input type="checkbox" checked onchange="toggleType('${type}', this.checked)">
      <div class="filter-dot" style="background:${color};border-radius:2px"></div>
      <span class="filter-label">${type.replace('_',' ')}</span>
      <span class="filter-count">${typeCounts[type] || 0}</span>
    `;
    typeContainer.appendChild(row);
  });
  
  // Compartment filters
  const compCounts = {};
  cy.nodes().forEach(n => {
    const c = n.data('compartment');
    compCounts[c] = (compCounts[c] || 0) + 1;
  });
  
  const compContainer = document.getElementById('comp-filters');
  Object.entries(COMPARTMENTS).forEach(([id, name]) => {
    if (!compCounts[id]) return;
    const row = document.createElement('label');
    row.className = 'filter-row';
    row.innerHTML = `
      <input type="checkbox" checked onchange="toggleComp('${id}', this.checked)">
      <div class="filter-dot" style="background:${COMP_COLORS[id] || '#64748b'};border-radius:50%"></div>
      <span class="filter-label">${name}</span>
      <span class="filter-count">${compCounts[id] || 0}</span>
    `;
    compContainer.appendChild(row);
  });
};

function toggleType(type, visible) {
  if (visible) activeTypes.add(type); else activeTypes.delete(type);
  applyFilters();
}
function toggleComp(comp, visible) {
  if (visible) activeComps.add(comp); else activeComps.delete(comp);
  applyFilters();
}
function applyFilters(options = {}) {
  if (!cy) return;
  showModifiers = document.getElementById('show-modifiers').checked;
  cy.startBatch();
  cy.nodes().forEach(n => {
    const inType = activeTypes.has(n.data('type'));
    const inComp = activeComps.has(n.data('compartment'));
    const inDeg = n.data('degree') >= minDegree;
    n.style('display', inType && inComp && inDeg ? 'element' : 'none');
  });
  cy.edges().forEach(e => {
    const src = e.source();
    const tgt = e.target();
    const isMod = e.data('edgeType') === 'modifier';
    const visible = src.style('display') !== 'none' && tgt.style('display') !== 'none' && !(isMod && !showModifiers);
    e.style('display', visible ? 'element' : 'none');
  });
  cy.endBatch();

  if (flowActive && !options.skipFlowReset) {
    buildFlowEdges();
    flowStep = 0;
  }
}

// Degree filter
document.getElementById('deg-filter').addEventListener('input', function() {
  minDegree = +this.value;
  document.getElementById('deg-val').textContent = minDegree;
  applyFilters();
});

function toggleLabels() {
  showLabels = document.getElementById('show-labels').checked;
  cy.batch(() => cy.nodes().style('label', showLabels ? 'data(label)' : ''));
}

// ============================================================
// SEARCH
// ============================================================
const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');
const searchableNodes = ELEMENTS
  .filter(el => el.group === 'nodes')
  .map(el => ({
    id: el.data.id,
    label: (el.data.label || '').toLowerCase(),
    fullName: (el.data.fullName || '').toLowerCase(),
    rawLabel: el.data.label,
    compName: el.data.compName,
    type: el.data.type,
  }));

searchInput.addEventListener('input', debounce(function() {
  const q = this.value.toLowerCase().trim();
  if (!q) { searchResults.classList.remove('open'); return; }

  const matches = searchableNodes.filter(n => n.label.includes(q) || n.fullName.includes(q)).slice(0, 20);
  searchResults.innerHTML = '';
  if (!matches.length) {
    searchResults.innerHTML = '<div class="sr-item" style="color:var(--text-dim)">No results</div>';
  } else {
    matches.forEach(n => {
      const item = document.createElement('div');
      item.className = 'sr-item';
      item.innerHTML = `
        <div class="sr-dot" style="background:${TYPE_COLORS[n.type]}"></div>
        <span>${n.rawLabel}</span>
        <span style="color:var(--text-dim);font-size:10px;">${n.compName}</span>
      `;
      item.onclick = () => {
        searchResults.classList.remove('open');
        searchInput.value = '';
        const liveNode = cy.$('#' + n.id);
        if (liveNode.length) selectNode(liveNode);
      };
      searchResults.appendChild(item);
    });
  }
  searchResults.classList.add('open');
}, 120));

document.addEventListener('click', e => {
  if (!e.target.closest('#search-wrap')) searchResults.classList.remove('open');
});

function selectNode(node) {
  cy.elements().removeClass('highlighted faded');
  node.addClass('highlighted');
  node.connectedEdges().addClass('highlighted');
  node.connectedEdges().connectedNodes().addClass('highlighted');
  cy.elements().not('.highlighted').addClass('faded');
  
  cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.3) }, { duration: 220 });
  inspectNode(node);
}

// ============================================================
// INSPECTOR
// ============================================================
function clearInspect() {
  cy.elements().removeClass('highlighted faded');
  document.getElementById('insp-empty').style.display = 'block';
  document.getElementById('insp-content').style.display = 'none';
}

function inspectNode(node) {
  cy.elements().removeClass('highlighted faded');
  node.addClass('highlighted');
  node.connectedEdges().addClass('highlighted');
  node.connectedEdges().connectedNodes().addClass('highlighted');
  cy.elements().not('.highlighted').addClass('faded');
  
  const d = node.data();
  const color = TYPE_COLORS[d.type] || '#64748b';
  
  const inEdges = node.incomers('node');
  const outEdges = node.outgoers('node');
  
  let html = `
    <div class="insp-name">${d.fullName}</div>
    <div class="insp-badge" style="color:${color};border-color:${color}20;background:${color}15">
      <div style="width:6px;height:6px;border-radius:50%;background:${color}"></div>
      ${d.type.replace('_',' ')}
    </div>
    <div class="insp-rows">
      <div class="insp-row"><div class="insp-key">ID</div><div class="insp-val" style="font-family:monospace;font-size:11px;color:var(--text-dim)">${d.id}</div></div>
      <div class="insp-row"><div class="insp-key">Location</div><div class="insp-val">${d.compName}</div></div>
      <div class="insp-row"><div class="insp-key">Degree</div><div class="insp-val">${d.degree} connections</div></div>
      <div class="insp-row"><div class="insp-key">SBO</div><div class="insp-val" style="font-family:monospace;font-size:10px;color:var(--text-dim)">${d.sbo}</div></div>
    </div>
  `;
  
  if (inEdges.length > 0) {
    html += `<div class="insp-section"><h4>↓ Upstream (${inEdges.length})</h4><div class="neighbor-list">`;
    inEdges.slice(0, 20).forEach(n => {
      const nc = TYPE_COLORS[n.data('type')] || '#64748b';
      html += `<div class="neighbor-item" onclick="selectNode(cy.$('#${n.data('id')}'))">
        <div style="width:7px;height:7px;border-radius:50%;background:${nc};flex-shrink:0"></div>
        <span>${n.data('label')}</span>
      </div>`;
    });
    if (inEdges.length > 20) html += `<div style="font-size:10px;color:var(--text-dim);padding:4px 6px">…${inEdges.length - 20} more</div>`;
    html += `</div></div>`;
  }
  
  if (outEdges.length > 0) {
    html += `<div class="insp-section"><h4>↑ Downstream (${outEdges.length})</h4><div class="neighbor-list">`;
    outEdges.slice(0, 20).forEach(n => {
      const nc = TYPE_COLORS[n.data('type')] || '#64748b';
      html += `<div class="neighbor-item" onclick="selectNode(cy.$('#${n.data('id')}'))">
        <div style="width:7px;height:7px;border-radius:50%;background:${nc};flex-shrink:0"></div>
        <span>${n.data('label')}</span>
      </div>`;
    });
    if (outEdges.length > 20) html += `<div style="font-size:10px;color:var(--text-dim);padding:4px 6px">…${outEdges.length - 20} more</div>`;
    html += `</div></div>`;
  }
  
  document.getElementById('insp-empty').style.display = 'none';
  const content = document.getElementById('insp-content');
  content.innerHTML = html;
  content.style.display = 'block';
}

function inspectEdge(edge) {
  cy.elements().removeClass('highlighted faded');
  edge.addClass('highlighted');
  edge.source().addClass('highlighted');
  edge.target().addClass('highlighted');
  cy.elements().not('.highlighted').addClass('faded');
  
  const d = edge.data();
  const html = `
    <div class="insp-name" style="font-size:12px">${d.reaction}</div>
    <div class="insp-badge" style="color:var(--accent2);border-color:#818cf820;background:#818cf815">
      edge
    </div>
    <div class="insp-rows">
      <div class="insp-row"><div class="insp-key">Type</div><div class="insp-val">${d.edgeType}</div></div>
      <div class="insp-row"><div class="insp-key">Reversible</div><div class="insp-val">${d.reversible ? 'Yes' : 'No'}</div></div>
      <div class="insp-row"><div class="insp-key">Source</div>
        <div class="insp-val"><span onclick="selectNode(cy.$('#${d.source}'))" style="cursor:pointer;color:var(--accent)">${cy.$('#'+d.source).data('label')}</span></div></div>
      <div class="insp-row"><div class="insp-key">Target</div>
        <div class="insp-val"><span onclick="selectNode(cy.$('#${d.target}'))" style="cursor:pointer;color:var(--accent)">${cy.$('#'+d.target).data('label')}</span></div></div>
    </div>
  `;
  
  document.getElementById('insp-empty').style.display = 'none';
  const content = document.getElementById('insp-content');
  content.innerHTML = html;
  content.style.display = 'block';
}

function toggleInspector() {
  document.getElementById('inspector').classList.toggle('collapsed');
}


// ============================================================
// FLOW ANIMATION
// ============================================================
let flowActive = false;
let flowInterval = null;
let flowSpeed = 650;
let flowStartNodeIds = [];
let flowFrontierNodeIds = [];
let flowVisitedNodeIds = new Set();
let flowVisitedEdgeIds = new Set();
let flowAdj = new Map();
let flowTrailOrder = [];
let flowTrailMaxAge = 9;
let flowStepIndex = 0;
const debouncedApplyFlow = debounce(() => applyFlow(), 220);

function normalizeFlowText(s) {
  return String(s || '').trim().toLowerCase();
}

function getVisibleReactionEdges() {
  const hubsOnly = document.getElementById('flow-hubs-only')?.checked;
  const minDeg = hubsOnly ? 5 : 1;
  return cy.edges(':visible').filter(e => {
    if (e.data('edgeType') !== 'reaction') return false;
    const sdeg = e.source().data('degree') || 0;
    const tdeg = e.target().data('degree') || 0;
    return sdeg >= minDeg || tdeg >= minDeg;
  });
}

function getVisibleReactionNodes() {
  const ids = new Set();
  getVisibleReactionEdges().forEach(e => {
    ids.add(e.source().id());
    ids.add(e.target().id());
  });
  return cy.nodes(':visible').filter(n => ids.has(n.id()));
}

function resolveSelectedStartNodes() {
  const selected = cy.nodes(':selected').filter(':visible').map(n => n.id());
  if (selected.length) {
    const labels = selected.map(id => cy.$('#' + id).data('label') || id);
    const input = document.getElementById('flow-start-input');
    if (input && document.getElementById('flow-start-mode')?.value === 'selected') {
      input.value = labels.join(', ');
    }
  }
  return selected;
}

function resolveCustomStartNodes() {
  const input = document.getElementById('flow-start-input');
  if (!input) return [];
  const raw = input.value.trim();
  if (!raw) return [];
  const wanted = raw.split(',').map(x => normalizeFlowText(x)).filter(Boolean);
  if (!wanted.length) return [];
  const found = [];
  getVisibleReactionNodes().forEach(n => {
    const id = normalizeFlowText(n.id());
    const label = normalizeFlowText(n.data('label'));
    const fullName = normalizeFlowText(n.data('fullName'));
    if (wanted.some(w => id === w || label === w || fullName === w || label.includes(w) || fullName.includes(w))) {
      found.push(n.id());
    }
  });
  return [...new Set(found)];
}

function resolvePerturbationStartNodes() {
  return getVisibleReactionNodes().filter(n => n.data('type') === 'perturbation').map(n => n.id());
}

function resolveRootStartNodes() {
  const nodes = getVisibleReactionNodes();
  const indeg = new Map();
  nodes.forEach(n => indeg.set(n.id(), 0));
  getVisibleReactionEdges().forEach(e => {
    const tid = e.target().id();
    if (indeg.has(tid)) indeg.set(tid, indeg.get(tid) + 1);
  });
  return nodes.filter(n => (indeg.get(n.id()) || 0) === 0).map(n => n.id());
}

function resolveAutoStartNodes() {
  const selected = resolveSelectedStartNodes();
  if (selected.length) return selected;
  const custom = resolveCustomStartNodes();
  if (custom.length) return custom;
  const perturb = resolvePerturbationStartNodes();
  if (perturb.length) return perturb;
  const roots = resolveRootStartNodes();
  if (roots.length) return roots;
  return getVisibleReactionNodes()
    .sort((a, b) => (b.data('degree') || 0) - (a.data('degree') || 0))
    .slice(0, 5)
    .map(n => n.id());
}

function getFlowStartNodes() {
  const mode = document.getElementById('flow-start-mode')?.value || 'auto';
  if (mode === 'selected') return resolveSelectedStartNodes();
  if (mode === 'custom') return resolveCustomStartNodes();
  if (mode === 'perturbation') return resolvePerturbationStartNodes();
  if (mode === 'roots') return resolveRootStartNodes();
  return resolveAutoStartNodes();
}

function buildFlowAdjacency() {
  flowAdj = new Map();
  getVisibleReactionEdges().forEach(e => {
    const s = e.source().id();
    const t = e.target().id();
    if (!flowAdj.has(s)) flowAdj.set(s, []);
    if (!flowAdj.has(t)) flowAdj.set(t, []);
    flowAdj.get(s).push({ edgeId: e.id(), targetId: t });
    // allow a soft backward continuation so starts chosen in the middle still look meaningful
    flowAdj.get(t).push({ edgeId: e.id(), targetId: s, backward: true });
  });
}

function resetFlowStyles() {
  cy.batch(() => {
    cy.nodes().removeStyle('border-color border-width background-blacken opacity');
    cy.edges().removeStyle('line-color target-arrow-color width opacity');
  });
}

function paintTrail() {
  cy.batch(() => {
    flowTrailOrder.forEach((step, idx) => {
      const age = flowTrailOrder.length - 1 - idx;
      const strength = Math.max(0.14, 1 - (age / flowTrailMaxAge));
      const edgeOpacity = 0.12 + strength * 0.68;
      const nodeBlacken = -0.04 - strength * 0.18;
      const edgeWidth = 1.1 + strength * 2.4;
      const nodeBorder = 1.4 + strength * 2.8;
      const color = age === 0 ? '#38bdf8' : '#1d8fbd';

      step.edgeIds.forEach(eid => {
        const e = cy.$('#' + eid);
        if (!e.length) return;
        e.style({
          'line-color': color,
          'target-arrow-color': color,
          'width': edgeWidth,
          'opacity': edgeOpacity
        });
      });

      step.nodeIds.forEach(nid => {
        const n = cy.$('#' + nid);
        if (!n.length) return;
        n.style({
          'border-color': color,
          'border-width': nodeBorder,
          'background-blacken': nodeBlacken,
          'opacity': 0.82 + strength * 0.18
        });
      });
    });

    flowStartNodeIds.forEach(nid => {
      const n = cy.$('#' + nid);
      if (!n.length) return;
      n.style({
        'border-color': '#fbbf24',
        'border-width': 5,
        'opacity': 1
      });
    });
  });
}

function updateFlowStatus(extra = '') {
  const el = document.getElementById('flow-step-label');
  if (!el) return;
  if (!flowStartNodeIds.length) {
    el.textContent = 'No valid start nodes';
    return;
  }
  el.textContent = `Step ${flowStepIndex} · ${flowVisitedNodeIds.size} nodes · ${flowVisitedEdgeIds.size} edges${extra ? ' · ' + extra : ''}`;
}

function seedFlow() {
  flowStepIndex = 0;
  flowVisitedNodeIds = new Set();
  flowVisitedEdgeIds = new Set();
  flowTrailOrder = [];
  flowStartNodeIds = getFlowStartNodes();
  flowFrontierNodeIds = [...flowStartNodeIds];
  buildFlowAdjacency();
  resetFlowStyles();

  flowStartNodeIds.forEach(id => flowVisitedNodeIds.add(id));
  if (flowFrontierNodeIds.length) {
    flowTrailOrder.push({ nodeIds: [...flowFrontierNodeIds], edgeIds: [] });
  }
  paintTrail();
  updateFlowStatus(flowFrontierNodeIds.length ? `${flowFrontierNodeIds.length} active` : '');
}

function advanceFlow() {
  if (!flowFrontierNodeIds.length) {
    stopFlow(true);
    return;
  }

  const nextFrontier = [];
  const nextSet = new Set();
  const stepEdges = [];
  const stepNodes = [];

  flowFrontierNodeIds.forEach(nid => {
    const outgoing = flowAdj.get(nid) || [];
    outgoing.forEach(({ edgeId, targetId }) => {
      if (!flowVisitedEdgeIds.has(edgeId)) {
        flowVisitedEdgeIds.add(edgeId);
        stepEdges.push(edgeId);
      }
      if (!flowVisitedNodeIds.has(targetId) && !nextSet.has(targetId)) {
        nextSet.add(targetId);
        nextFrontier.push(targetId);
        stepNodes.push(targetId);
      }
    });
  });

  nextFrontier.forEach(nid => flowVisitedNodeIds.add(nid));
  flowFrontierNodeIds = nextFrontier;
  flowStepIndex += 1;

  if (stepEdges.length || stepNodes.length) {
    flowTrailOrder.push({ nodeIds: stepNodes, edgeIds: stepEdges });
    while (flowTrailOrder.length > flowTrailMaxAge) flowTrailOrder.shift();
    paintTrail();
  }

  updateFlowStatus(nextFrontier.length ? `${nextFrontier.length} active` : 'complete');

  if (!flowFrontierNodeIds.length) {
    stopFlow(true);
  }
}

function startFlow() {
  seedFlow();
  if (!flowStartNodeIds.length) return;
  flowActive = true;
  const btn = document.getElementById('flow-btn');
  btn.textContent = '⏹ Stop Flow';
  btn.classList.add('active');
  flowInterval = setInterval(advanceFlow, flowSpeed);
}

function stopFlow(completed = false) {
  flowActive = false;
  clearInterval(flowInterval);
  flowInterval = null;
  const btn = document.getElementById('flow-btn');
  btn.textContent = completed ? '✓ Flow Complete' : '▶ Start Flow';
  btn.classList.remove('active');
  if (completed) updateFlowStatus('complete');
}

function toggleFlow() {
  if (flowActive) stopFlow(false);
  else startFlow();
}

function updateFlowSpeed(val) {
  flowSpeed = parseInt(val, 10);
  const speedLabel = document.getElementById('flow-speed-val');
  if (speedLabel) speedLabel.textContent = (flowSpeed / 1000).toFixed(1) + 's';
  if (flowActive) {
    clearInterval(flowInterval);
    flowInterval = setInterval(advanceFlow, flowSpeed);
  }
}

function applyFlow() {
  seedFlow();
  if (flowActive && flowStartNodeIds.length) {
    clearInterval(flowInterval);
    flowInterval = setInterval(advanceFlow, flowSpeed);
  }
}
